name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk ErenlerTV.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ERENLER TV (son sürüm)
          files: ErenlerTV.apk
          make_latest: true
